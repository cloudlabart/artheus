# 칼럼 현행화 — 매월 1일 오전 10시 37분(한국 시간) 자동 실행. Actions 탭에서 칼럼을 지정해 직접 실행도 가능.
# 최신 SEO 점검(content/reports/latest.json)의 보강 추천 칼럼을 Claude가 보강하고, 바로 배포하지 않고 PR(검토 요청)로 올립니다.
# PR을 확인하고 병합(Merge)해야 사이트에 반영됩니다.
# 필요한 Secret: ANTHROPIC_API_KEY (console.anthropic.com 에서 발급)
name: 칼럼 현행화

on:
  schedule:
    - cron: "37 1 1 * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "보강할 칼럼 slug (띄어쓰기로 여러 개, 비우면 점검 리포트의 추천 상위 2개)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 보강할 칼럼 고르기
        id: pick
        env:
          SLUGS_IN: ${{ github.event.inputs.slugs }}
        run: |
          SLUGS=$(echo "$SLUGS_IN" | tr -cd 'a-z0-9 -')
          if [ -z "$SLUGS" ] && [ -f content/reports/latest.json ]; then
            SLUGS=$(python3 -c "import json;n=json.load(open('content/geo-seo.config.json')).get('maintenance',{}).get('auto_refresh_per_month',2);print(' '.join(json.load(open('content/reports/latest.json'))['refresh_candidates'][:n]))")
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUGS" ]; then echo "보강할 칼럼이 없습니다."; fi

      - name: Claude로 칼럼 보강
        if: steps.pick.outputs.slugs != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            아터스 칼럼 현행화 작업입니다. 대상 칼럼: ${{ steps.pick.outputs.slugs }}
            각 칼럼마다 .claude/skills/content-pipeline 의 `refresh <slug>` 절차를 따르세요.
            - 먼저 CLAUDE.md, content/style/voice.md(배준우 문체 — 이 말투로 쓰기), content/geo-seo.config.json, tools/geo-seo/references/geo-seo-playbook.md, content/reports/latest.json 을 읽고,
              latest.json 의 그 칼럼 reasons·missing_queries 를 보강의 근거로 삼으세요.
            - 빠진 검색 의도는 섹션·FAQ로 보강, 오래된 수치·연도·링크는 출처를 다시 확인해 갱신, 깨진 링크는 교체.
            - 확인하지 못한 사실은 쓰지 말고, 실제 경험·사례를 지어내지 마세요. 솔루션 3–5개, 추천 도서·구매 링크 규칙 유지.
            - slug 와 status: published 는 그대로, updated 만 오늘 날짜로.
            - python3 tools/geo-seo/scripts/seo_lint.py content/column/<slug>/article.md --out content/column/<slug>/audit.json 이 통과할 때까지 수정.
            - 끝나면 python3 tools/geo-seo/scripts/build_site.py 를 실행해 public/column 을 다시 만드세요.
            - 마지막으로 content/reports/refresh-summary.md 에 칼럼별로 무엇을 왜 바꿨는지, 사람이 확인할 점을 한국어로 짧게 쓰세요.
            git 명령은 실행하지 마세요(PR은 다음 단계가 만듭니다).
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,WebSearch,WebFetch,Task,Skill,TodoWrite,Bash(python3 tools/geo-seo/scripts/seo_lint.py:*),Bash(python3 tools/geo-seo/scripts/build_site.py:*),Bash(python3 tools/geo-seo/scripts/publish.py naver:*)"

      - name: PR 만들기
        if: steps.pick.outputs.slugs != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: seo-refresh/${{ github.run_id }}
          title: "칼럼 현행화: ${{ steps.pick.outputs.slugs }}"
          body-path: content/reports/refresh-summary.md
          commit-message: "칼럼 현행화: ${{ steps.pick.outputs.slugs }}"
          labels: seo-refresh
          add-paths: |
            content/column
            content/reports/refresh-summary.md
            public/column
            public/sitemap.xml
            public/rss.xml
