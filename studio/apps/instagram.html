<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>인스타그램</title><link rel="stylesheet" href="/__studio/kit/kit.css"><script src="/__studio/kit/kit.js"></script></head>
<body><div class="page">
  <div class="head"><h1>인스타그램</h1><span class="sub" id="who"></span><span class="spacer"></span>
    <a class="btn" href="https://www.instagram.com/artheus_act/" target="_blank" rel="noopener">@artheus_act ↗</a>
    <button class="btn" id="webzine">🗞 웹진 만들기</button><button class="btn" id="reload">새로고침</button></div>
  <div id="out"><div class="muted"><span class="spin"></span> 불러오는 중…</div></div>
</div>
<script>
const { $, esc, api, fmtDate } = K;
const n = (x) => (+x || 0).toLocaleString('ko-KR');
async function load() {
  try {
    const d = await api('/__studio/api/instagram'); const p = d.profile;
    $('#who').textContent = '@' + p.username;
    const avg = d.media.length ? Math.round(d.media.reduce((s, m) => s + (m.like_count || 0) + (m.comments_count || 0), 0) / d.media.length) : 0;
    $('#out').innerHTML = `<div class="grid g4">${[['팔로워', n(p.followers_count)], ['팔로잉', n(p.follows_count)], ['게시물', n(p.media_count)], ['최근 평균 반응', n(avg)]].map(([a, b]) => `<div class="card stat"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
      <div class="card"><h2>최근 게시물 <small>반응 = 좋아요 + 댓글</small></h2><div class="thumbs">${d.media.map((m) => `<a href="${esc(m.permalink)}" target="_blank" rel="noopener"><img src="${esc(m.thumbnail_url || m.media_url)}" alt="" loading="lazy"><span>${fmtDate(m.timestamp)} · ${m.media_type === 'CAROUSEL_ALBUM' ? '캐러셀' : m.media_type === 'VIDEO' ? '릴스·영상' : '사진'}</span><span class="muted">♥ ${n(m.like_count)} · 💬 ${n(m.comments_count)}</span></a>`).join('')}</div></div>`;
  } catch (e) {
    $('#out').innerHTML = `<div class="notice warn">${esc(e.message)}</div>
      <div class="notice"><b>연결 방법</b> (둘 중 편한 쪽 하나)<br>
        <b>A. 인스타그램 로그인 (간단)</b> — developers.facebook.com › 내 앱 › 앱 만들기 › 사용 사례 <b>"Instagram API"</b> › API 설정 › <b>액세스 토큰 생성</b>에서 @artheus_act 로그인 → 나온 토큰(IG로 시작)을 복사해 설정에 넣기. ID 칸은 비워 두세요.<br>
        <b>B. 페이스북 로그인</b> — 인스타 계정을 프로페셔널로 바꾸고 학원 페이스북 페이지와 연결 → Graph API 탐색기에서 <code>instagram_basic, instagram_manage_insights, pages_show_list, pages_read_engagement</code> 체크 후 토큰 생성(학원 페이지 선택) → 액세스 토큰 도구에서 <b>장기 토큰</b>으로 연장 → 토큰(EAA로 시작)만 설정에 넣기. ID는 자동으로 찾아요.<br>
        토큰은 60일마다 새로 받아야 해요. <a href="#" id="go">설정 › 인스타그램 열기</a></div>`;
    $('#go').onclick = (ev) => { ev.preventDefault(); K.open('settings'); };
  }
}
$('#webzine').onclick = () => K.open('webzine');
$('#reload').onclick = load; load();
</script></body></html>
