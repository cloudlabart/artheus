<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="g2light" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2D5E88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#091929" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="#0C1E2E"/>
  <rect width="600" height="800" fill="url(#g2light)"/>

  <!-- Breath / movement wave lines -->
  <g fill="none" stroke="#A9C5D9" stroke-linecap="round">
    <!-- Large slow waves (breath rhythm) -->
    <path d="M 0 320 C 100 280, 200 360, 300 320 S 500 280, 600 320" stroke-width="2" opacity="0.4"/>
    <path d="M 0 350 C 100 310, 200 390, 300 350 S 500 310, 600 350" stroke-width="1.5" opacity="0.25"/>
    <path d="M 0 380 C 100 340, 200 420, 300 380 S 500 340, 600 380" stroke-width="1" opacity="0.15"/>

    <!-- Fast inner waves (tension) -->
    <path d="M 0 420 C 50 400, 100 440, 150 420 S 250 400, 300 420 S 400 400, 450 420 S 550 400, 600 420" stroke-width="1.5" opacity="0.35"/>
    <path d="M 0 450 C 50 430, 100 470, 150 450 S 250 430, 300 450 S 400 430, 450 450 S 550 430, 600 450" stroke-width="1" opacity="0.2"/>
    <path d="M 0 480 C 50 460, 100 500, 150 480 S 250 460, 300 480 S 400 460, 450 480 S 550 460, 600 480" stroke-width="1" opacity="0.12"/>

    <!-- Radiating from center — energy burst -->
    <path d="M 300 400 Q 200 300 120 200" stroke-width="1.5" opacity="0.2"/>
    <path d="M 300 400 Q 400 300 480 200" stroke-width="1.5" opacity="0.2"/>
    <path d="M 300 400 Q 300 270 300 160" stroke-width="1.5" opacity="0.2"/>
    <path d="M 300 400 Q 180 350 60 310" stroke-width="1" opacity="0.15"/>
    <path d="M 300 400 Q 420 350 540 310" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Concentric circles — breath expansion -->
  <g fill="none" stroke="#A9C5D9" opacity="0.1">
    <circle cx="300" cy="400" r="60"/>
    <circle cx="300" cy="400" r="120"/>
    <circle cx="300" cy="400" r="180"/>
    <circle cx="300" cy="400" r="250"/>
  </g>

  <!-- Center dot — focal point -->
  <circle cx="300" cy="400" r="6" fill="#D8EAF5" opacity="0.7"/>
  <circle cx="300" cy="400" r="12" fill="#A9C5D9" opacity="0.2"/>

  <!-- Vertical rule lines (stage wings reference) -->
  <line x1="80"  y1="0" x2="80"  y2="800" stroke="#A9C5D9" stroke-width="1" opacity="0.08"/>
  <line x1="520" y1="0" x2="520" y2="800" stroke="#A9C5D9" stroke-width="1" opacity="0.08"/>

  <!-- Label -->
  <text x="22" y="775" fill="#A9C5D9" font-size="18" opacity="0.35" font-family="monospace" letter-spacing="2">02</text>
  <text x="300" y="745" text-anchor="middle" fill="#A9C5D9" font-size="11" opacity="0.25" font-family="monospace" letter-spacing="5">BREATH</text>
</svg>
