<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="g4light" cx="35%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#A9C5D9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#091929" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4light2" cx="68%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#2D5E88" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#091929" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="#0A1B2A"/>
  <rect width="600" height="800" fill="url(#g4light)"/>
  <rect width="600" height="800" fill="url(#g4light2)"/>

  <!-- Two-shot: face-to-face scene work -->
  <!-- Figure A — left, leaning forward -->
  <g opacity="0.65">
    <!-- Head -->
    <ellipse cx="195" cy="310" rx="26" ry="28" fill="#D8EAF5"/>
    <!-- Neck + torso -->
    <path d="M 183 338 Q 175 390 170 450 L 196 450 L 204 420 L 212 450 L 220 450 Q 215 390 207 338 Z" fill="#B8CFE0"/>
    <!-- Arm extended toward other figure -->
    <path d="M 207 365 Q 255 350 285 340" stroke="#C8DDE8" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- Other arm at side -->
    <path d="M 183 358 Q 155 380 135 410" stroke="#B8CFE0" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 190 450 L 178 540" stroke="#B0C8D8" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 214 450 L 222 540" stroke="#B0C8D8" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Figure B — right, receptive posture -->
  <g opacity="0.5">
    <!-- Head -->
    <ellipse cx="405" cy="330" rx="26" ry="28" fill="#A9C5D9"/>
    <!-- Neck + torso -->
    <path d="M 393 358 Q 385 415 382 470 L 406 470 L 414 440 L 422 470 L 430 470 Q 427 415 417 358 Z" fill="#8CADC8"/>
    <!-- Arm receiving toward other figure -->
    <path d="M 393 383 Q 345 368 315 358" stroke="#A0BECE" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- Other arm at side -->
    <path d="M 417 376 Q 445 395 465 420" stroke="#8CADC8" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 400 470 L 388 555" stroke="#8CADC8" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 420 470 L 430 555" stroke="#8CADC8" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Connection line — the "scene" between them -->
  <line x1="221" y1="345" x2="379" y2="348" stroke="#F3F0EA" stroke-width="1" stroke-dasharray="6,6" opacity="0.15"/>

  <!-- Floor shadows -->
  <ellipse cx="200" cy="545" rx="45" ry="12" fill="#030C15" opacity="0.5"/>
  <ellipse cx="406" cy="560" rx="45" ry="12" fill="#030C15" opacity="0.4"/>

  <!-- Floor line dividing space -->
  <line x1="90" y1="600" x2="510" y2="600" stroke="#A9C5D9" stroke-width="1" opacity="0.1"/>

  <!-- Abstract script/text in background -->
  <g fill="#A9C5D9" opacity="0.05" font-family="monospace" font-size="13" letter-spacing="2">
    <text x="40" y="680">장면을 읽는 기준</text>
    <text x="40" y="700">내 연기로 만들어가도록</text>
    <text x="40" y="720">호흡은 모든 표현의 근원이다</text>
  </g>

  <!-- Label -->
  <text x="22" y="775" fill="#A9C5D9" font-size="18" opacity="0.35" font-family="monospace" letter-spacing="2">04</text>
  <text x="300" y="745" text-anchor="middle" fill="#A9C5D9" font-size="11" opacity="0.25" font-family="monospace" letter-spacing="5">SCENE WORK</text>
</svg>
