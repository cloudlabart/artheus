<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="g1light" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#C8DDE8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#091929" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="#091929"/>
  <rect width="600" height="800" fill="url(#g1light)"/>

  <!-- Spotlight cone from top -->
  <polygon points="300,0 240,340 360,340" fill="#D0E8F5" opacity="0.08"/>
  <polygon points="300,0 200,360 400,360" fill="#C0D8EC" opacity="0.04"/>

  <!-- Floor glow -->
  <ellipse cx="300" cy="360" rx="90" ry="30" fill="#D8EAF5" opacity="0.22"/>
  <ellipse cx="300" cy="360" rx="150" ry="50" fill="#A9C5D9" opacity="0.08"/>

  <!-- Human figure — looking upward, arms open -->
  <g opacity="0.7">
    <!-- Head tilted back slightly -->
    <ellipse cx="300" cy="230" rx="28" ry="30" fill="#E8F2F8"/>
    <!-- Neck -->
    <rect x="293" y="258" width="14" height="20" rx="4" fill="#D8EAF5"/>
    <!-- Torso -->
    <path d="M 278 278 Q 268 340 260 400 L 288 400 L 300 370 L 312 400 L 340 400 Q 332 340 322 278 Z" fill="#C8DDE8"/>
    <!-- Left arm open/spread -->
    <path d="M 282 295 Q 220 275 170 240" stroke="#C8DDE8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Right arm open/spread -->
    <path d="M 318 295 Q 380 275 430 240" stroke="#C8DDE8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 285 400 L 268 500" stroke="#C8DDE8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 315 400 L 332 500" stroke="#C8DDE8" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Shadow on floor -->
  <ellipse cx="300" cy="490" rx="55" ry="15" fill="#040E18" opacity="0.5"/>

  <!-- Abstract motion arcs around figure -->
  <g fill="none" stroke="#A9C5D9" stroke-linecap="round" opacity="0.2">
    <path d="M 160 230 Q 200 160 300 140 Q 400 160 440 230" stroke-width="1.5"/>
    <path d="M 140 250 Q 185 155 300 130 Q 415 155 460 250" stroke-width="1"/>
    <path d="M 170 210 Q 210 150 300 135 Q 390 150 430 210" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Number label -->
  <text x="22" y="775" fill="#A9C5D9" font-size="18" opacity="0.35" font-family="monospace" letter-spacing="2">01</text>

  <!-- Bottom caption -->
  <text x="300" y="745" text-anchor="middle" fill="#A9C5D9" font-size="11" opacity="0.25" font-family="monospace" letter-spacing="5">OPEN</text>
</svg>
